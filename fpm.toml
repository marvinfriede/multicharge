name = "multicharge"
version = "0.6.0"
license = "Apache-2.0"
author = ["Sebastian Ehlert"]
maintainer = ["@awvwgk"]
copyright = "Copyright 2021-2026 Sebastian Ehlert"

[build]
link = ["lapack", "blas"]

[dependencies]
mctc-lib.git = "https://github.com/grimme-lab/mctc-lib.git"
mctc-lib.rev = "53cd11f9324b47910ee7e9161d85e47e9a7b9fad"

[dev-dependencies]
mstore.git = "https://github.com/grimme-lab/mstore.git"
mstore.tag = "v0.4.0"

[extra.fortitude.check]
ignore = [
  "C002",  # interface without implicit none
  "C003",  # implicit none(external)
]
per-file-ignores."src/multicharge/blas.F90" = ["C071"]
per-file-ignores."src/multicharge/lapack.F90" = ["C071"]
line-length = 132
